<!doctype html>
<html><head><meta charset="utf-8"><title>Direct-Mapped Cache Controller</title>
<style>
:root{--ink:#0E0F12;--paper:#EDEBE6;--dim:#7A7D85;--line:#2B2E35;--acc:#FF5A1F;--panel:#16181D}
html,body{margin:0;background:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Menlo,monospace}
.d{font-family:"Avenir Next Condensed",sans-serif;font-weight:700;letter-spacing:-0.01em;line-height:0.95}
.m{font-family:Menlo,monospace}
.abs{position:absolute;white-space:pre}
.scene{position:absolute;inset:0}
</style></head>
<body><div id="stage"></div>
<script src="cap_times.js"></script>
<script>
// Film = pure function of time. window.seek(t) paints frame t. No timers, no transitions.
const W = 1920, H = 1080, DUR = 300;
const NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const outC = x => 1 - Math.pow(1 - x, 3);
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outBack = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const P = (t, a, d) => clamp((t - a) / d);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261116);
const initWord = i => (Math.imul(i, 0x9E3779B1) ^ 0x5A5A5A5A) >>> 0;
const hex = (v, n = 8) => (v >>> 0).toString(16).toUpperCase().padStart(n, '0');

const CUES = []; window.CUES = CUES;
const SCENES = []; const GLOBAL = [];
let cur = null;
function scene(start, end, build) {
  const root = document.createElement('div'); root.className = 'scene'; stage.appendChild(root);
  const sc = { start, end, root, anims: [] }; cur = sc; SCENES.push(sc); build(root); return sc;
}
const anim = f => cur.anims.push(f);
const cue = (tl, type) => CUES.push({ t: +(cur.start + tl).toFixed(3), type });

// ---------- element builders ----------
function T(parent, x, y, text, o = {}) {
  const e = document.createElement('div'); e.className = 'abs ' + (o.cls || 'm');
  Object.assign(e.style, { left: x + 'px', top: y + 'px', fontSize: (o.size || 32) + 'px', color: o.color || 'var(--paper)' });
  if (o.w) { e.style.width = o.w + 'px'; e.style.whiteSpace = 'normal'; }
  e.textContent = text; parent.appendChild(e); return e;
}
function B(parent, x, y, w, h, text = '', o = {}) {
  const e = document.createElement('div'); e.className = 'abs ' + (o.cls || 'm');
  Object.assign(e.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', fontSize: (o.size || 30) + 'px',
    lineHeight: (o.lh || h - 2 * (o.bw ?? 2)) + 'px', textAlign: o.align || 'center', boxSizing: 'border-box',
    border: `${o.bw ?? 2}px solid ${o.border || 'var(--line)'}`, background: o.bg || 'transparent', color: o.color || 'var(--paper)',
    borderRadius: (o.r || 0) + 'px', paddingLeft: (o.pl || 0) + 'px' });
  e.textContent = text; parent.appendChild(e); return e;
}
function G(parent, x, y, w, h) { const e = document.createElement('div'); e.className = 'abs'; Object.assign(e.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); parent.appendChild(e); return e; }
function S(parent, tag, a = {}) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; }
function svgLayer(root) {
  const s = S(root, 'svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }); Object.assign(s.style, { position: 'absolute', left: 0, top: 0, overflow: 'visible' });
  const defs = S(s, 'defs'); const id = 'm' + SCENES.length;
  for (const [suf, col] of [['', '#7A7D85'], ['a', '#FF5A1F'], ['p', '#EDEBE6']]) {
    const m = S(defs, 'marker', { id: id + suf, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' });
    S(m, 'path', { d: 'M0,0 L10,5 L0,10 z', fill: col });
  }
  s.mid = id; return s;
}

// ---------- animators (every branch sets every property it owns) ----------
function hide(e, t, t0, out, d) { const h = t < t0 || (out != null && t >= out + d); e.style.visibility = h ? 'hidden' : 'visible'; return h; }
function wipe(e, t0, o = {}) {
  const d = o.d ?? 0.4, out = o.out, c = ('c' in o) ? o.c : 'tick'; if (c) cue(t0, c);
  anim(t => {
    if (hide(e, t, t0, out, 0.3)) return;
    if (out != null && t >= out) { const q = inOut(P(t, out, 0.3)); e.style.clipPath = `inset(-30% -5% -30% ${q * 100}%)`; e.style.transform = `translateX(${q * 40}px)`; return; }
    const p = outC(P(t, t0, d)); e.style.clipPath = p >= 1 ? 'none' : `inset(-30% ${100 - 100 * p}% -30% -5%)`; e.style.transform = `translateX(${(1 - p) * -36}px)`;
  });
}
function rise(e, t0, o = {}) {
  const d = o.d ?? 0.45, out = o.out, c = ('c' in o) ? o.c : 'tick'; if (c) cue(t0, c);
  anim(t => {
    if (hide(e, t, t0, out, 0.3)) return;
    if (out != null && t >= out) { const q = inOut(P(t, out, 0.3)); e.style.clipPath = `inset(-10% -5% ${q * 100}% -5%)`; e.style.transform = `translateY(${-q * 40}px)`; return; }
    const p = outC(P(t, t0, d)); e.style.clipPath = p >= 1 ? 'none' : `inset(${100 - 100 * p}% -5% -10% -5%)`; e.style.transform = `translateY(${(1 - p) * 60}px)`;
  });
}
function pop(e, t0, o = {}) {
  const d = o.d ?? 0.3, out = o.out, c = ('c' in o) ? o.c : 'pop'; if (c) cue(t0, c);
  anim(t => {
    if (hide(e, t, t0, out, 0.25)) return;
    let s, op;
    if (out != null && t >= out) { const q = P(t, out, 0.25); s = 1 - 0.3 * q; op = 1 - q; }
    else { const p = P(t, t0, d); s = 0.5 + 0.5 * outBack(p); op = clamp(p * 4); }
    e.style.transform = `scale(${s})`; e.style.opacity = op;
  });
}
function typeT(e, text, t0, o = {}) {
  const cps = o.cps || 34, out = o.out; cue(t0, 'type');
  anim(t => {
    if (hide(e, t, t0, out, 0)) return;
    const n = Math.floor(clamp((t - t0) * cps, 0, text.length));
    e.textContent = text.slice(0, n) + (n < text.length && Math.floor(t * 4) % 2 === 0 ? '█' : '');
  });
}
function draw(p, t0, o = {}) {
  const d = o.d ?? 0.5, out = o.out, c = ('c' in o) ? o.c : null; if (c) cue(t0, c);
  const L = p.getTotalLength(); p.style.strokeDasharray = L; const me = p.getAttribute('marker-end');
  anim(t => {
    const on = t >= t0 && (out == null || t < out); p.style.visibility = on ? 'visible' : 'hidden';
    const q = inOut(P(t, t0, d)); p.style.strokeDashoffset = L * (1 - q);
    if (me) { if (q >= 0.97) p.setAttribute('marker-end', me); else p.removeAttribute('marker-end'); }
  });
}
function arrow(s, d, t0, o = {}) {
  const col = o.color === 'acc' ? '#FF5A1F' : o.color === 'paper' ? '#EDEBE6' : '#7A7D85';
  const suf = o.color === 'acc' ? 'a' : o.color === 'paper' ? 'p' : '';
  const p = S(s, 'path', { d, fill: 'none', stroke: col, 'stroke-width': o.w || 3, 'marker-end': `url(#${s.mid}${suf})` });
  draw(p, t0, o); return p;
}
// a value that steps through [time, value] pairs; f(el, value, sinceChange)
function steps(e, seq, f) { anim(t => { let v = seq[0][1], at = -1e9; for (const [tt, vv] of seq) if (t >= tt) { v = vv; at = tt; } f(e, v, t - at); }); }
function flash(e, times, base, hot, dur = 0.5) {
  anim(t => { let on = false; for (const tt of times) if (t >= tt && t < tt + dur) on = true; e.style.background = on ? hot : base; });
}

// ---------- shared pieces ----------
function header(root, num, title, who, out) {
  const n = T(root, 120, 62, num, { cls: 'd', size: 150, color: 'var(--acc)' });
  const ti = T(root, 330, 86, title, { cls: 'd', size: 96 });
  const w = T(root, 334, 188, who, { size: 28, color: 'var(--dim)' });
  wipe(n, 0, { c: null, out }); wipe(ti, 0.5, { c: 'hit', out }); wipe(w, 1.0, { out });
}
// status line in the header's right side; seq = [[t, text], ...]
function status(root, seq, end) {
  seq.forEach(([t0, text], i) => {
    const e = T(root, 1060, 100, text, { size: 32, color: text.startsWith('!') ? 'var(--acc)' : 'var(--paper)' });
    e.textContent = text.replace(/^!/, '');
    const out = i + 1 < seq.length ? seq[i + 1][0] - 0.3 : end; wipe(e, t0, { out });
  });
}

// ================================================================ SCENE 1
scene(0, 30, root => {
  const ADDR = 0x1000, cells = [];
  for (let i = 0; i < 32; i++) {
    const b = B(root, 0, 330, 48, 72, String((ADDR >>> (31 - i)) & 1), { size: 40, border: '#3A3E46' });
    cells.push(b); pop(b, i * 0.028, { c: null, out: 6.5 });
  }
  cue(0, 'type');
  anim(t => cells.forEach((b, i) => {
    const g = inOut(P(t, 2.0, 0.5)), grp = i >= 28 ? 2 : i >= 22 ? 1 : 0;
    b.style.left = (120 + i * 52 + g * 28 * grp) + 'px';
    const col = g > 0.5 ? (grp === 1 ? '#FF5A1F' : grp === 2 ? '#7A7D85' : '#EDEBE6') : '#EDEBE6';
    const one = i === 19 && t >= 1.0 && t < 2.0;
    b.style.color = one ? '#0E0F12' : col; b.style.background = one ? '#FF5A1F' : 'transparent'; b.style.borderColor = g > 0.5 && grp === 1 ? '#FF5A1F' : '#3A3E46';
  }));
  wipe(T(root, 120, 150, 'WHERE DOES 0x00001000 LIVE?', { cls: 'd', size: 120 }), 0.0, { c: null, d: 0.5, out: 6.5 });
  cue(1.0, 'pop');
  const lab = [[120, 'TAG · 22 bits', 1140, '#EDEBE6'], [1292, 'INDEX · 6', 308, '#FF5A1F'], [1632, 'OFFSET · 4', 204, '#7A7D85']];
  lab.forEach(([x, s, w, col], k) => {
    wipe(B(root, x, 414, w, 4, '', { bw: 0, bg: col }), 2.5 + k * 0.5, { c: null, out: 6.5 });
    wipe(T(root, x, 430, s, { size: 30, color: col }), 2.5 + k * 0.5, { out: 6.5 });
  });
  const strip = G(root, 120, 560, 1664, 110), bars = [];
  for (let i = 0; i < 64; i++) bars.push(B(strip, i * 26, 0, 20, 110, '', { bg: '#1B1D22', border: '#2B2E35' }));
  wipe(strip, 0.5, { d: 0.6, out: 6.5 });
  anim(t => { bars[0].style.background = t >= 4.5 ? '#FF5A1F' : '#1B1D22'; });
  wipe(T(root, 120, 700, 'index 000000  →  line 0 of 64. Exactly one place.', { size: 36, color: 'var(--acc)' }), 4.5, { c: 'hit', out: 6.5 });

  wipe(T(root, 112, 230, 'DIRECT-MAPPED\nCACHE CONTROLLER', { cls: 'd', size: 175 }), 7.0, { c: 'boom', out: 11.5 });
  typeT(T(root, 120, 605, '', { size: 34, color: 'var(--dim)' }), 'Verilog HDL  ·  CSA222 Modern Computer Architecture  ·  Project 6', 8.0, { out: 11.5 });
  wipe(T(root, 120, 680, '1 KB  ·  4-STATE FSM  ·  SELF-CHECKING TESTBENCH', { size: 34, color: 'var(--acc)' }), 10.0, { out: 11.5 });

  wipe(T(root, 120, 150, 'THE TEAM', { size: 30, color: 'var(--dim)' }), 12.0, { out: 22.5 });
  [['Tathagat Harsh', '2401010477', 'controller FSM'], ['M S Thejas', '2401010255', 'cache storage RAMs'],
   ['Garv Verma', '2401010168', 'address decoder + comparator'], ['Parv Goyal', '2401010322', 'memory model + integration'],
   ['Vaibhav Rajput', '2401010487', 'testbench + results']].forEach(([n, r, role], i) => {
    const y = 210 + i * 120, t0 = 12.5 + 2 * i;
    wipe(T(root, 120, y, n, { cls: 'd', size: 88 }), t0, { c: 'pop', out: 22.5 });
    wipe(T(root, 820, y + 32, r, { size: 30, color: 'var(--dim)' }), t0 + 0.15, { c: null, out: 22.5 });
    wipe(T(root, 1100, y + 32, role, { size: 30 }), t0 + 0.3, { c: null, out: 22.5 });
  });

  [[120, 230, '1 KB', 'cache data'], [980, 230, '64 LINES', 'direct-mapped'], [120, 520, '16 B BLOCKS', '4 words each'], [980, 520, 'WRITE-THROUGH', 'no-write-allocate']]
    .forEach(([x, y, big, small], k) => {
      const t0 = 23.0 + k * 1.5;
      rise(T(root, x, y, big, { cls: 'd', size: 128, color: k === 3 ? 'var(--acc)' : 'var(--paper)' }), t0, { c: 'hit' });
      wipe(T(root, x + 4, y + 140, small, { size: 30, color: 'var(--dim)' }), t0 + 0.5, { c: null });
    });
});

// ================================================================ SCENE 2  Garv
scene(30, 80, root => {
  header(root, '01', 'ADDRESS → LINE', 'GARV VERMA  ·  addr_decoder.v + tag_comparator.v');
  const sv = svgLayer(root), cells = [];
  for (let i = 0; i < 32; i++) { const b = B(root, 120 + i * 52, 300, 48, 64, String((0x1000 >>> (31 - i)) & 1), { size: 36, border: '#3A3E46' }); cells.push(b); pop(b, 2.5 + i * 0.02, { c: i ? null : 'pop', out: 22.0 }); }
  anim(t => cells.forEach((b, i) => {
    const g = inOut(P(t, 3.5, 0.5)), grp = i >= 28 ? 2 : i >= 22 ? 1 : 0;
    b.style.left = (120 + i * 52 + g * 28 * grp) + 'px';
    b.style.color = g > .5 ? (grp === 1 ? '#FF5A1F' : grp === 2 ? '#7A7D85' : '#EDEBE6') : '#EDEBE6';
    b.style.borderColor = g > .5 && grp === 1 ? '#FF5A1F' : '#3A3E46';
  }));
  [[120, 'TAG · 22', 1140, '#EDEBE6'], [1292, 'INDEX · 6', 308, '#FF5A1F'], [1632, 'OFFSET · 4', 204, '#7A7D85']].forEach(([x, s, w, col], k) => {
    wipe(B(root, x, 378, w, 4, '', { bw: 0, bg: col }), 4.0 + k, { c: null, out: 22.0 });
    wipe(T(root, x, 392, s, { size: 32, color: col }), 4.0 + k, { out: 22.0 });
  });
  wipe(T(root, 1632, 436, 'word 2\n+ byte 2', { size: 26, color: 'var(--dim)' }), 7.0, { out: 22.0 });
  [['1024 B ÷ 16 B = 64 lines   →   6 index bits', 10], ['16-byte block              →   4 offset bits', 14], ['32 − 6 − 4                  =  22 tag bits', 18]]
    .forEach(([s, t0], k) => typeT(T(root, 120, 520 + k * 72, '', { size: 42 }), s, t0, { out: 22.0 }));

  // mapping
  const col = G(root, 1180, 290, 600, 540); wipe(col, 22.5, { d: 0.5, out: 34.0 });
  const rows = [];
  for (let i = 0; i < 8; i++) { const r = B(col, 0, i * 62, 600, 54, '', { size: 28, align: 'left', pl: 20, border: '#2B2E35', bg: '#15171B' }); rows.push(r); }
  T(col, 0, 8 * 62 + 4, '⋮   56 more lines (64 total)', { size: 26, color: 'var(--dim)' });
  steps(rows[0], [[0, ''], [23.5, 'tag 0x000004'], [32.5, 'tag 0x000005']], (e, v, s) => { e.textContent = 'line 0     ' + v; e.style.borderColor = v.endsWith('5') && s < 1.5 ? '#FF5A1F' : '#2B2E35'; });
  steps(rows[1], [[0, ''], [29.5, 'tag 0x000004']], (e, v) => { e.textContent = 'line 1     ' + v; });
  for (let i = 2; i < 8; i++) rows[i].textContent = 'line ' + i;
  [['0x00001000', 'line 0 · cold miss', 0, 23.0, null], ['0x00001004', 'line 0 · same block → hit', 0, 26.0, 'paper'],
   ['0x00001010', 'line 1 · next block', 1, 29.0, null], ['0x00001400', 'line 0 · CONFLICT → evicts 0x1000', 0, 32.0, 'acc']]
    .forEach(([a, note, line, t0, c], k) => {
      const y = 300 + k * 130;
      wipe(T(root, 120, y, a, { size: 48, color: c === 'acc' ? 'var(--acc)' : 'var(--paper)' }), t0, { c: c === 'acc' ? 'miss' : 'pop', out: 34.0 });
      wipe(T(root, 124, y + 62, note, { size: 28, color: c === 'acc' ? 'var(--acc)' : 'var(--dim)' }), t0 + 0.25, { c: null, out: 34.0 });
      arrow(sv, `M440 ${y + 28} C 800 ${y + 28}, 820 ${290 + line * 62 + 27}, 1170 ${290 + line * 62 + 27}`, t0 + 0.5, { color: c, out: 34.0 });
    });

  // comparator
  const box = (x, y, w, lab, val) => { wipe(T(root, x, y - 40, lab, { size: 28, color: 'var(--dim)' }), 0, { c: null, out: 1e9 }); return B(root, x, y, w, 100, val, { size: 48 }); };
  const st = box(120, 320, 440, 'stored tag (tag RAM)', '0x000004'), rq = box(120, 490, 440, 'request tag (address)', '0x000004'), va = box(120, 660, 200, 'valid bit', '1');
  // labels above boxes share the boxes' timing
  root.querySelectorAll('div').forEach(() => {});
  rise(st, 34.5, { out: 1e9 }); rise(rq, 35.5); rise(va, 40.0);
  const eq = B(root, 720, 380, 150, 150, '==', { size: 48, r: 75, border: '#EDEBE6' }); pop(eq, 36.5);
  steps(eq, [[0, '=='], [38.5, '✓']], (e, v, s) => { e.textContent = v; e.style.color = v === '✓' ? '#0E0F12' : '#EDEBE6'; e.style.background = v === '✓' ? '#EDEBE6' : 'transparent'; });
  const and = B(root, 1040, 480, 200, 170, 'AND', { cls: 'd', size: 56, border: '#EDEBE6' }); pop(and, 41.5);
  arrow(sv, 'M560 370 C 640 370, 640 430, 712 430', 37.0);
  arrow(sv, 'M560 540 C 640 540, 640 480, 712 480', 37.0);
  arrow(sv, 'M320 710 C 700 710, 880 610, 1032 610', 40.5);
  arrow(sv, 'M870 455 C 960 455, 960 520, 1032 520', 41.5, { color: 'paper' });
  arrow(sv, 'M1240 565 L 1330 565', 43.0, { color: 'paper' });
  steps(va, [[0, '1'], [45.0, '0']], (e, v) => { e.textContent = v; e.style.color = v === '0' ? '#FF5A1F' : '#EDEBE6'; e.style.borderColor = v === '0' ? '#FF5A1F' : '#2B2E35'; });
  wipe(T(root, 1350, 480, 'HIT', { cls: 'd', size: 170 }), 43.0, { c: 'hit', out: 46.5 });
  wipe(T(root, 1350, 480, 'MISS', { cls: 'd', size: 170, color: 'var(--acc)' }), 46.5, { c: 'miss' });
  wipe(T(root, 1354, 680, 'valid = 0 → never a\nfalse hit', { size: 30, color: 'var(--dim)' }), 47.5, { c: null });
  // the three small labels above comparator boxes must follow the boxes
  const labs = [...root.children].filter(e => /stored tag|request tag|valid bit/.test(e.textContent));
  anim(t => { labs[0].style.visibility = t >= 34.5 ? 'visible' : 'hidden'; labs[1].style.visibility = t >= 35.5 ? 'visible' : 'hidden'; labs[2].style.visibility = t >= 40 ? 'visible' : 'hidden'; });
});

// ================================================================ SCENE 3  Thejas
scene(80, 130, root => {
  header(root, '02', 'STORAGE', 'M S THEJAS  ·  cache_rams.v');
  status(root, [[8.0, '64 × (1 + 22 + 128) = 9,664 bits'], [11.0, '!rst → all 64 valid bits = 0'], [16.0, 'tag matches, valid = 0 → no hit'],
                [20.0, 'block_we: 128-bit line, one cycle'], [26.0, 'word_we: one 32-bit word']], 31.0);
  const R = 14, y0 = 300, rh = 36;
  const vcol = G(root, 120, 250, 80, 600), tcol = G(root, 220, 250, 300, 600), dcol = G(root, 550, 250, 1250, 600);
  T(vcol, 0, 0, 'VALID', { size: 26, color: 'var(--dim)' }); T(tcol, 0, 0, 'TAG  64 × 22', { size: 26, color: 'var(--dim)' }); T(dcol, 0, 0, 'DATA  64 × 128 = 1 KB   (word 0 · 1 · 2 · 3)', { size: 26, color: 'var(--dim)' });
  wipe(vcol, 2.5, { out: 31.0 }); wipe(tcol, 4.0, { out: 31.0 }); wipe(dcol, 5.5, { d: 0.6, out: 31.0 });
  const V = [], Tg = [], D = [];
  for (let r = 0; r < R; r++) {
    const y = 50 + r * rh;
    V.push(B(vcol, 0, y, 70, rh - 4, '?', { size: 26, border: '#2B2E35', bg: '#15171B' }));
    Tg.push(B(tcol, 0, y, 300, rh - 4, '0x' + hex(Math.floor(rnd() * 0x3FFFFF), 6), { size: 26, border: '#2B2E35', bg: '#15171B', color: '#7A7D85' }));
    const row = [];
    for (let w = 0; w < 4; w++) row.push(B(dcol, w * 312, y, 304, rh - 4, hex(Math.floor(rnd() * 2 ** 32)), { size: 26, border: '#2B2E35', bg: '#15171B', color: '#7A7D85' }));
    D.push(row);
  }
  T(dcol, 0, 50 + R * rh + 4, '⋮  64 lines', { size: 24, color: 'var(--dim)' });
  V.forEach((e, r) => steps(e, r === 0 ? [[0, '?'], [11 + r * 0.06, '0'], [22.5, '1']] : [[0, '?'], [11 + r * 0.06, '0']],
    (el, v, s) => { el.textContent = v; el.style.color = v === '?' ? '#7A7D85' : v === '1' ? '#0E0F12' : '#EDEBE6'; el.style.background = v === '1' ? '#EDEBE6' : (v === '0' && s < 0.25 ? '#FF5A1F' : '#15171B'); }));
  cue(11.0, 'miss');
